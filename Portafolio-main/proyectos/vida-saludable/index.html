<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vida Saludable | Hirohito Tarazona</title><meta name="description" content="Calculadora de IMC con rutina de ejercicios y dieta sugerida."><meta name="author" content="Hirohito Alexandre Tarazona Quispe"><link rel="canonical" href="https://hirohito-tarazona-portafolio.vercel.app/proyectos/vida-saludable/index.html"><meta property="og:type" content="website"><meta property="og:title" content="Vida Saludable | Hirohito Tarazona"><meta property="og:description" content="Calculadora de IMC con rutina de ejercicios y dieta sugerida."><meta property="og:image" content="https://hirohito-tarazona-portafolio.vercel.app/img/og-image.jpg"><meta property="og:url" content="https://hirohito-tarazona-portafolio.vercel.app/proyectos/vida-saludable/index.html"><link rel="stylesheet" href="../base.css"></head><body><main><a class="volver" href="../../index.html#galeria">← Volver al portafolio</a><h1>Vida Saludable</h1>
<form id="f" class="row box"><input name="peso" type="number" step="0.1" min="20" max="300" placeholder="Peso (kg)" aria-label="Peso en kg" required><input name="altura" type="number" min="100" max="230" placeholder="Altura (cm)" aria-label="Altura en cm" required><button>Calcular</button></form>
<div class="box" id="r" aria-live="polite">Ingresa tu peso y altura para calcular tu IMC.</div>
</main><script>
const f=document.getElementById('f'),r=document.getElementById('r');
f.onsubmit=e=>{e.preventDefault();const p=+f.peso.value,h=+f.altura.value/100,i=p/(h*h);
const [c,ru,di]=i<18.5?['Bajo peso','Fuerza 3 veces por semana','Más calorías con proteínas y carbohidratos complejos']:i<25?['Peso normal','Cardio y fuerza 4 veces por semana','Dieta variada y balanceada']:i<30?['Sobrepeso','Caminata de 30 minutos diarios y fuerza 3 veces por semana','Menos azúcares y frituras, más verduras']:['Obesidad','Caminata suave diaria, aumentando poco a poco','Consulta con un nutricionista para un plan a tu medida'];
r.innerHTML=`<p class="big">${i.toFixed(1)}</p><p><b>${c}</b></p><p><b>Rutina:</b> ${ru}</p><p><b>Dieta:</b> ${di}</p><p><small>Referencial. No reemplaza a un profesional de salud.</small></p>`};
</script></body></html>
